name: Build and publish Windows update

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xanty-public-release
  cancel-in-progress: false

jobs:
  windows:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Normalize temporary paths
        run: |
          "TEMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Test
        run: |
          python -c "import os, pathlib, tempfile, unittest, sys; test_root=pathlib.Path(os.environ['RUNNER_TEMP'])/'xanty-tests'; test_root.mkdir(exist_ok=True); tempfile.tempdir=str(test_root.resolve()); result=unittest.TextTestRunner(verbosity=1).run(unittest.defaultTestLoader.discover('tests')); sys.exit(not result.wasSuccessful())"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node tests/test_profile_ui.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --test tests/profile_management_ui.test.js tests/workspace_operations_ui.test.js tests/updates_ui.test.js tests/proxy_rotation_ui.test.js tests/profiles_screen_ui.test.js tests/premium_surfaces_ui.test.js tests/motion_ui.test.js tests/interface_quality_ui.test.js tests/desktop_shortcuts.test.js tests/profile_presentation_ui.test.js tests/appearance_ui.test.js
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem xgenius/web/static/*.js | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE) { throw 'Invalid JavaScript' } }
          python -m compileall -q xgenius tools
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Assign release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/prepare_release.py
      - name: Build onefile EXE
        run: python tools/build_windows.py --onefile --dist-dir dist/release
      - name: Install installer compiler
        run: |
          if (-not (Test-Path 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe')) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Build installer with official browser and WebView2 bootstrapper
        run: python tools/build_installer.py
      - name: Verify clean installation and removal
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP 'xanty-installer-smoke'
          $setup = (Resolve-Path dist/release/XAnty-Setup.exe).Path
          $process = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOICONS',"/DIR=`"$testRoot`"") -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw 'Installer failed' }
          foreach ($relative in @('XAnty.exe','runtime/Bro/chrome.exe','runtime/Drivers/chromedriver.exe','unins000.exe')) {
            if (-not (Test-Path -LiteralPath (Join-Path $testRoot $relative))) { throw "Missing installed file: $relative" }
          }
          python tools/smoke_browser.py --chrome (Join-Path $testRoot 'runtime/Bro/chrome.exe') --driver (Join-Path $testRoot 'runtime/Drivers/chromedriver.exe')
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/smoke_proxy.py --chrome (Join-Path $testRoot 'runtime/Bro/chrome.exe') --driver (Join-Path $testRoot 'runtime/Drivers/chromedriver.exe')
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/smoke_desktop.py --exe (Join-Path $testRoot 'XAnty.exe') --version '${{ steps.version.outputs.version }}'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $uninstall = Start-Process -FilePath (Join-Path $testRoot 'unins000.exe') -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -WindowStyle Hidden -PassThru -Wait
          if ($uninstall.ExitCode -ne 0) { throw 'Uninstaller failed' }
      - name: Publish complete verified update
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish_release.py
      - name: Verify actual startup update from the published EXE
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $head = gh api "repos/$env:GITHUB_REPOSITORY/branches/main" --jq '.commit.sha'
          if ($head -ne $env:GITHUB_SHA) { exit 0 }
          $source = Get-Content -LiteralPath xgenius/__init__.py -Raw -Encoding UTF8
          $source = $source -replace '__version__ = "[^"]+"', '__version__ = "1.0.0.0"'
          Set-Content -LiteralPath xgenius/__init__.py -Value $source -Encoding UTF8
          python tools/build_windows.py --onefile --dist-dir dist/update-probe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $digest = (Get-FileHash -LiteralPath dist/release/XAnty.exe -Algorithm SHA256).Hash.ToLower()
          python tools/smoke_desktop.py --exe dist/update-probe/XAnty.exe --version $env:RELEASE_VERSION --sha256 $digest
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
