name: Build Windows release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Check release version and configure repository
        shell: pwsh
        run: |
          @'
          import json, os
          from pathlib import Path
          from xgenius import __version__
          tag = os.environ['GITHUB_REF_NAME']
          if tag != 'v' + __version__:
              raise SystemExit('Git tag must match xgenius.__version__')
          config = {'repository': os.environ['GITHUB_REPOSITORY'], 'asset': 'XAnty.exe'}
          Path('xgenius/update_config.json').write_text(json.dumps(config, indent=2), encoding='utf-8')
          '@ | python -
      - name: Test
        shell: pwsh
        run: |
          python -m unittest discover -s tests -q
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node tests/test_profile_ui.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --check xgenius/web/static/app.js
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --check xgenius/web/static/updates.js
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m compileall -q xgenius tools
      - name: Build onefile EXE
        run: python tools/build_windows.py --onefile --dist-dir dist/release
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" dist/release/XAnty.exe --draft --verify-tag --generate-notes
