<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XAnty</title>
<style>
:root{font:15px/1.6 'Segoe UI',sans-serif;color-scheme:dark;background:#101014;color:#efeff5}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px}.card{width:min(100%,460px);text-align:center}.logo{height:112px;width:112px;object-fit:contain;border-radius:22px;background:#2600db}h1{font-size:28px;margin:18px 0 8px}p{color:#b9b9c9;margin:8px 0}small{display:block;color:#9292a5;margin-top:22px}.spinner{display:block;width:24px;height:24px;margin:26px auto;border:2px solid #383844;border-top-color:#a46bff;border-radius:50%;animation:spin .8s linear infinite}.error-text{white-space:pre-wrap;overflow-wrap:anywhere;color:#ff858c;text-align:left;padding:16px;background:#22222d;border-radius:8px}button{font:inherit;border:0;border-radius:7px;color:white;background:#9253ed;padding:9px 22px;cursor:pointer;margin-top:20px}.error-only{display:none}body.error .loading-only{display:none}body.error .error-only{display:block}body.error button{display:inline-block}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.spinner{animation:none}}
</style></head><body class="{{MODE}}"><main class="card"><img class="logo" src="data:image/png;base64,{{LOGO}}" alt=""><h1>XAnty</h1><div class="loading-only"><p>Загружаем профили и настройки…</p><span class="spinner" aria-label="Загрузка"></span><small id="elapsed" role="status">Окно можно перемещать или закрыть во время загрузки.</small></div><div class="error-only"><p>Не удалось запустить XAnty</p><p class="error-text">{{ERROR}}</p><small>Проверьте рабочую папку и доступ к файлам. Подробности сохранены в журнале запуска.</small><button onclick="window.pywebview?.api?.close()">Закрыть</button></div></main><script>const start=Date.now();setInterval(()=>{const seconds=Math.floor((Date.now()-start)/1000);if(seconds>=10)document.getElementById('elapsed').textContent=`Подготовка занимает больше времени: ${seconds} с. Окно остаётся доступным.`;},1000);</script></body></html>
