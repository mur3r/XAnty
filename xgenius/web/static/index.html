<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XAnty</title><link rel="icon" href="assets/app.ico"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="design-system.css"><link rel="stylesheet" href="profiles-screen.css"><link rel="stylesheet" href="premium-surfaces.css"><link rel="stylesheet" href="motion.css"></head>
<body>
<div id="screen-offline" class="welcome"><div class="welcome-card"><div class="brand"><span class="brand-mark"><img src="assets/app-icon.png" alt="XAnty"></span>XAnty</div><h1 data-i18n="offline_title"></h1><p data-i18n="offline_text"></p><span class="spinner"></span></div></div>
<div id="screen-setup" class="welcome hidden"><div class="welcome-card setup-card">
  <div class="welcome-top"><div class="brand"><span class="brand-mark"><img src="assets/app-icon.png" alt="XAnty"></span>XAnty</div><select data-language data-i18n-title="language"><option value="ru">Русский</option><option value="en">English</option><option value="uk">Українська</option></select></div>
  <h1 data-i18n="setup_title"></h1><p data-i18n="setup_text"></p>
  <form id="setup-form"><label class="field"><span data-i18n="base_dir"></span><input id="setup-dir" autocomplete="off" spellcheck="false" placeholder="D:\XAnty"></label>
    <label class="check"><input id="setup-create" type="checkbox"><span data-i18n="create_dir"></span></label>
    <div class="setup-files"><span data-i18n="required_files"></span><code>Bro/chrome.exe</code><code>Drivers/chromedriver.exe</code></div>
    <div id="setup-msg" class="notice warning hidden"></div><button type="submit" class="btn primary full"><span data-i18n="continue"></span><span>→</span></button>
  </form>
</div></div>
<div id="screen-main" class="shell hidden">
  <nav class="rail"><div class="brand-mark rail-brand" title="XAnty"><img src="assets/app-icon.png" alt="XAnty"></div>
    <button class="rail-button active" data-tab="profiles" data-i18n-title="profiles"><span data-ic="layers"></span></button>
    <button class="rail-button" data-tab="transfers" data-i18n-title="transfers"><span data-ic="copy"></span><span id="job-indicator" class="rail-dot hidden"></span></button>
    <button class="rail-button" data-tab="workspace" data-i18n-title="workspace_operations"><span data-ic="sliders"></span></button>
    <button class="rail-button" data-tab="load" data-i18n-title="load"><span data-ic="activity"></span></button><span class="spacer"></span>
    <button class="rail-button" id="btn-help" data-i18n-title="help"><span data-ic="help-circle"></span></button>
    <button class="rail-button" id="btn-theme" data-i18n-title="theme"><span data-ic="sun"></span></button>
    <button class="rail-button exit-button" id="btn-exit" data-i18n-title="exit"><span data-ic="power"></span></button>
  </nav>
  <aside class="sidebar"><div class="sidebar-brand">XAnty<span class="version-tag">DESKTOP</span></div><div class="workspace-label" data-i18n="workspace"></div>
    <div class="folder-search"><span data-ic="search"></span><input id="folder-search" type="search" data-i18n-placeholder="find_folder"></div>
    <div id="folder-tabs" class="folder-list"></div>
    <button class="btn folder-create" data-tool="folder_create"><span data-ic="plus"></span><span data-i18n="create_folder"></span></button>
    <div id="folder-management" class="folder-management hidden"><button class="text-button" data-tool="folder_rename" data-i18n="rename_folder"></button><button class="text-button danger-text" data-tool="folder_delete" data-i18n="delete_folder"></button></div>
    <div class="sidebar-bottom"><div class="sidebar-caption" data-i18n="language"></div><select data-language><option value="ru">Русский</option><option value="en">English</option><option value="uk">Українська</option></select><div class="local-badge"><i></i><span data-i18n="local"></span></div></div>
  </aside>
  <main class="main">
    <header class="page-header"><div><div class="eyebrow" data-i18n="workspace"></div><h1 id="page-title"></h1><p id="page-subtitle"></p></div><div class="header-actions">
      <button class="btn" data-tool="dolphin_import"><span data-ic="download"></span><span data-i18n="from_dolphin"></span></button><button class="btn" data-tool="transfer"><span data-ic="copy"></span><span data-i18n="transfer"></span></button><button class="btn primary" data-tool="add"><span data-ic="plus"></span><span data-i18n="new_profile"></span></button>
    </div></header>
    <div id="update-banner" class="update-banner hidden" role="status"></div>
    <section id="view-profiles" class="view profiles-view">
      <div class="overview-row"><div id="summary" class="summary"></div><div class="connection"><i></i><span id="connection-label"></span><button id="btn-refresh" class="icon-button" data-i18n-title="refresh"><span data-ic="refresh-cw"></span></button></div></div>
      <section class="profile-panel" aria-busy="false"><div class="profile-management-toolbar"><button class="btn small" data-tool="workspace"><span data-ic="layers"></span><span data-i18n="workspace_operations"></span></button><button class="btn small" data-tool="browser_settings"><span data-ic="sliders"></span><span data-i18n="browser_tools_settings"></span></button><button class="btn small" data-tool="trash"><span data-ic="trash-2"></span><span data-i18n="trash"></span></button><button class="btn small" data-tool="history"><span data-ic="activity"></span><span data-i18n="change_history"></span></button><span id="profile-results" class="profile-results visually-hidden"></span><span class="spacer"></span><button class="btn small" data-tool="text_import"><span data-ic="upload"></span><span data-i18n="text_import"></span></button><button class="btn small" data-tool="columns"><span data-ic="sliders"></span><span data-i18n="columns"></span></button></div><div class="table-toolbar"><div class="search-field"><span data-ic="search"></span><input id="f-search" type="search" data-i18n-placeholder="search" autocomplete="off"></div><label class="profile-filter"><span class="visually-hidden" data-i18n="profile_status"></span><select id="f-profile-status" data-i18n-title="profile_status"><option value="" data-i18n="all_profile_statuses"></option><option value="active" data-i18n="work_active"></option><option value="new" data-i18n="work_new"></option><option value="review" data-i18n="work_review"></option><option value="unused" data-i18n="work_unused"></option></select></label><label class="profile-filter"><span class="visually-hidden" data-i18n="status"></span><select id="f-status" data-i18n-title="status"><option value="" data-i18n="all_statuses"></option><option value="active" data-i18n="opened"></option><option value="inactive" data-i18n="closed"></option><option value="error" data-i18n="attention"></option><option value="busy" data-i18n="in_progress"></option></select></label><label class="profile-filter"><span class="visually-hidden" data-i18n="proxy_filter"></span><select id="f-proxy" data-i18n-title="proxy_filter"><option value="" data-i18n="all_proxies"></option><option value="ok" data-i18n="proxy_working"></option><option value="error" data-i18n="proxy_failed"></option><option value="unchecked" data-i18n="proxy_unchecked"></option><option value="none" data-i18n="no_proxy"></option></select></label><label class="profile-filter profile-filter-sort"><span class="visually-hidden" data-i18n="profiles_sort"></span><select id="profile-sort" data-i18n-title="profiles_sort"><option value="favorites" data-i18n="profiles_sort_favorites"></option><option value="number" data-i18n="profiles_sort_number"></option><option value="name" data-i18n="profiles_sort_name"></option><option value="last_launch" data-i18n="profiles_sort_recent"></option></select></label><button id="profiles-clear-filters" class="icon-button profile-reset" data-i18n-title="reset_filters"><span data-ic="x"></span></button></div>
        <div id="selection-bar" class="selection-bar hidden"><strong id="sel-count"></strong><span id="selection-scope" class="selection-scope"></span><button id="btn-check-selected" class="btn small" data-tool="check_selected"><span data-ic="activity"></span><span data-i18n="check_proxies"></span></button><span id="batch-progress" class="hidden" role="status"></span><button class="btn small start" data-tool="login"><span data-ic="play"></span><span data-i18n="start"></span></button><button class="btn small" data-tool="close"><span data-ic="pause"></span><span data-i18n="stop"></span></button><button class="btn small" data-tool="bulk_edit"><span data-ic="sliders"></span><span data-i18n="bulk_edit"></span></button><button class="btn small" data-tool="move"><span data-ic="folder"></span><span data-i18n="move"></span></button><button class="btn small" data-tool="export_selected"><span data-ic="copy"></span><span data-i18n="transfer"></span></button><span class="spacer"></span><button class="icon-button danger-text" data-tool="delete" data-i18n-title="delete"><span data-ic="trash-2"></span></button><button id="sel-clear" class="icon-button" data-i18n-title="clear_selection"><span data-ic="x"></span></button></div>
        <div id="profiles-loading" class="profiles-loading hidden" role="status"><span class="spinner"></span><span data-i18n="profiles_loading"></span></div><div id="profiles-load-error" class="profiles-load-error hidden" role="status"><span data-i18n="profiles_load_error"></span><button id="profiles-retry" class="text-button" data-i18n="profiles_retry"></button></div>
        <div class="table-wrap"><table class="profiles-table"><thead><tr><th class="check-col"><input type="checkbox" id="chk-all" data-i18n-title="select_page" aria-label="Выбрать страницу"></th><th data-column="number" data-i18n="profile_number"></th><th data-column="name" data-i18n="name"></th><th data-column="start" data-i18n="start"></th><th data-column="profile_status" data-i18n="profile_status"></th><th data-column="status" data-i18n="browser_state"></th><th data-column="proxy" data-i18n="proxy"></th><th data-column="auto_login" data-i18n="auto_login"></th><th data-column="last_launch" data-i18n="last_launch"></th><th data-column="runtime" data-i18n="runtime"></th><th data-column="tags" data-i18n="tags"></th><th data-column="notes" data-i18n="notes"></th><th data-column="group" data-i18n="folder"></th><th data-column="profile_size" data-i18n="profile_size"></th><th data-column="reminder" data-i18n="reminder"></th><th class="row-options-col"></th></tr></thead><tbody id="rows"></tbody></table></div>
        <div id="empty" class="empty hidden"><div class="empty-icon"><span data-ic="layers"></span></div><h2 data-i18n="empty_title"></h2><p data-i18n="empty_text"></p><div class="empty-actions"><button class="btn primary" data-tool="add"><span data-ic="plus"></span><span data-i18n="new_profile"></span></button><button class="btn" data-tool="dolphin_import"><span data-ic="download"></span><span data-i18n="import_all_dolphin"></span></button></div></div>
        <div id="no-matches" class="empty compact hidden"><div class="empty-icon"><span data-ic="search"></span></div><h3 id="profiles-empty-heading" data-i18n="no_matches"></h3><p id="profiles-empty-hint" data-i18n="profiles_no_matches_hint"></p><button class="btn" id="reset-filters" data-i18n="reset_filters"></button></div>
        <footer class="table-footer"><button id="select-everything" class="text-button" data-i18n="select_filtered"></button><span class="spacer"></span><label class="page-size"><span data-i18n="page_size"></span><select id="page-size"><option>25</option><option selected>50</option><option>100</option><option>250</option></select></label><span id="page-count"></span><label class="profile-page-jump"><span data-i18n="profiles_page"></span><input id="profile-page-jump" type="number" value="1" min="1" step="1" data-i18n-title="profiles_page_jump"><span>/</span><span id="profile-page-total">1</span></label><button id="page-prev" class="icon-button" data-i18n-title="previous">‹</button><button id="page-next" class="icon-button" data-i18n-title="next">›</button></footer>
      </section>
    </section>
    <section id="view-transfers" class="view hidden"><div class="section-intro"><p data-i18n="transfer_intro"></p><button class="btn primary" data-tool="package_import"><span data-ic="upload"></span><span data-i18n="import_package"></span></button></div><div id="jobs" class="jobs"></div></section>
    <section id="view-workspace" class="view hidden"><div id="workspace-panel" aria-live="polite"></div></section>
    <section id="view-load" class="view hidden"><p class="section-note" data-i18n="performance_text"></p><div id="metrics" class="metrics"></div><div class="metric-panel"><h3 data-i18n="cpu_history"></h3><svg id="load-chart" role="img" viewBox="0 0 800 170" preserveAspectRatio="none"></svg><div class="chart-legend"><span><i class="cpu-color"></i><span data-i18n="cpu"></span></span><span><i class="memory-color"></i><span data-i18n="memory"></span></span></div></div><div class="metric-panel"><div class="panel-heading"><h3 data-i18n="per_profile"></h3><a class="btn small" href="/api/sysmon/csv?kind=accounts" download>CSV</a></div><div id="load-accounts"></div></div></section>
    <section id="logpanel" class="logpanel collapsed"><div class="log-head"><button id="log-toggle" class="text-button"><span data-ic="terminal"></span><span data-i18n="monitor"></span><span id="log-badge" class="badge">0</span></button><span class="spacer"></span><input id="log-filter" type="search" data-i18n-placeholder="log_search"><button id="log-copy" class="icon-button" data-i18n-title="copy"><span data-ic="copy"></span></button><button id="log-clear" class="text-button" data-i18n="clear"></button></div><div id="logs" class="logs"></div></section>
    <footer class="app-footer"><span class="footer-dot"></span><span id="footer-version"></span><span class="footer-separator">·</span><span id="base-dir" class="path"></span><span class="spacer"></span><button class="text-button" data-update-open data-i18n="updates"></button><span class="footer-separator">·</span><button class="text-button" data-tool="stop_all" data-i18n="stop_all"></button></footer>
  </main>
</div>
<div id="modal-root"></div><div id="toasts" aria-live="polite"></div>
<script src="motion.js"></script><script src="icons.js"></script><script src="i18n.js"></script><script src="profile-management.js"></script><script src="profiles-screen.js"></script><script src="profile-tools.js"></script><script src="workspace-operations.js"></script><script src="app.js"></script><script src="dialogs.js"></script><script src="updates.js"></script><script src="desktop-shortcuts.js"></script>
</body></html>
